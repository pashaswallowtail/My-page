<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>问号随机抽奖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            min-height: 100vh;
            background: #e8edf2;
            padding: 26px 16px;
        }
        h1 {
            text-align: center;
            color: #444;
            margin-bottom: 30px;
            font-size: 26px;
        }
        .wrap{
            max-width:1160px;
            margin:0 auto;
            display:grid;
            grid-template-columns: 1fr 340px;
            gap:30px;
        }
        @media(max-width:768px){
            .wrap{
                grid-template-columns: 1fr;
            }
        }
        /* 左侧奖品区 */
        .prize-area{
            box-shadow:  8px 8px 16px #c8cdd2, -8px -8px 16px #ffffff;
            border-radius:22px;
            padding:24px;
        }
        .prize-area h2{
            font-size:18px;
            color:#555;
            margin-bottom:20px;
        }
        .prize-grid{
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(130px,1fr));
            gap:16px;
        }
        .prize-card{
            background:#e8edf2;
            height:140px;
            border-radius:18px;
            box-shadow:  6px 6px 12px #c8cdd2, -6px -6px 12px #ffffff;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:42px;
            color:#999;
            transition:0.25s;
        }
        .prize-card.flash{
            box-shadow: inset 5px 5px 10px #c8cdd2, inset -5px -5px 10px #ffffff;
            color:#ff6b6b;
        }
        /* 右侧结果区 */
        .result-area{
            box-shadow:  8px 8px 16px #c8cdd2, -8px -8px 16px #ffffff;
            border-radius:22px;
            padding:24px;
            text-align:center;
        }
        .result-area h2{
            font-size:18px;
            color:#555;
            margin-bottom:20px;
        }
        .result-card{
            min-height:220px;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
        }
        .result-card .question{
            font-size:60px;
            color:#999;
        }
        .result-card img{
            width:150px;
            height:150px;
            object-fit:cover;
            border-radius:16px;
            margin-bottom:12px;
        }
        .result-card .noimg{
            width:150px;
            height:150px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#888;
            border-radius:16px;
            background:#dee2e7;
            margin-bottom:12px;
        }
        .result-name{
            font-size:20px;
            color:#ff6b6b;
            font-weight:bold;
        }
        .history-area{
            max-width:1160px;
            margin:30px auto 0;
            box-shadow:  8px 8px 16px #c8cdd2, -8px -8px 16px #ffffff;
            border-radius:22px;
            padding:24px;
        }
        .history-area h2{
            font-size:18px;
            color:#555;
            margin-bottom:16px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .history-grid{
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(110px,1fr));
            gap:14px;
        }
        .history-item{
            background:#e8edf2;
            padding:10px;
            border-radius:14px;
            box-shadow:  4px 4px 8px #c8cdd2, -4px -4px 8px #ffffff;
            text-align:center;
        }
        .history-item img{
            width:80px;
            height:80px;
            object-fit:cover;
            border-radius:10px;
            margin-bottom:8px;
        }
        .history-item .noimg{
            width:80px;
            height:80px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#888;
            border-radius:10px;
            background:#dee2e7;
            margin:0 auto 8px;
        }
        .history-item .name{
            font-size:13px;
            color:#444;
        }
        .btn-wrap{
            text-align:center;
            margin-top:32px;
            display:flex;
            gap:16px;
            justify-content:center;
            flex-wrap:wrap;
        }
        button{
            padding:14px 36px;
            border:none;
            background:#e8edf2;
            color:#555;
            font-size: 18px;
            border-radius:999px;
            cursor:pointer;
            box-shadow:  8px 8px 16px #c8cdd2, -8px -8px 16px #ffffff;
        }
        button:active{
            box-shadow: inset 6px 6px 12px #c8cdd2, inset -6px -6px 12px #ffffff;
        }
        button:disabled{
            color:#aaa;
            cursor:not-allowed;
            box-shadow: inset 6px 6px 12px #c8cdd2, inset -6px -6px 12px #ffffff;
        }
    </style>
</head>
<body>
    <h1>🎰 问号随机抽奖，可对换，每人可抽五次</h1>
    <div class="wrap">
        <div class="prize-area">
            <h2>🎁 奖品池</h2>
            <div class="prize-grid" id="prizeGrid"></div>
        </div>
        <div class="result-area">
            <h2>✨ 本次抽取结果</h2>
            <div class="result-card" id="resultCard">
                <div class="question">?</div>
            </div>
        </div>
    </div>
    <div class="history-area">
        <h2>
            📜 抽奖记录
            <button id="clearHistoryBtn" style="padding:6px 14px;font-size:14px;">清空记录</button>
        </h2>
        <div class="history-grid" id="historyGrid"></div>
    </div>
    <div class="btn-wrap">
        <button id="startBtn">开始抽取</button>
        <button id="resetBtn">重置抽奖</button>
    </div>

    <script>
        // ========= 修改奖品清单 =========
        const basePrizeList = [
            { name: "绿叶镇Copy一张自选", img: "https://images.alphacoders.com/459/thumb-1920-459469.jpg" },
            { name: "昆虫小画一张", img: "https://cff2.earth.com/uploads/2022/10/29061828/Insect-5-scaled.jpg" },
            { name: "一串发发贴纸", img: "https://img.magnific.com/premium-photo/flowers-3d-flower-icons-colorful-real-color-white-background_1230902-335.jpg" },
            { name: "谢谢参与", img: "https://cdn.pixabay.com/photo/2023/03/18/18/31/thanks-7861153_1280.png" },
            { name: "20个女孩线稿", img: "https://img.magnific.com/premium-vector/sketch-girl-with-ponytail_605379-2358.jpg?w=2000" },
            { name: "五张小画", img: "https://lirp.cdn-website.com/830db03d/dms3rep/multi/opt/header1img-1920w.jpg" },
            { name: "一张大画", img: "https://img.magnific.com/premium-photo/landscape-background-fantasy-sweet-candy-land-game-cupcakes-confectionery-chocolate-dream-scene-panorama-design-lollipop-dessert-candy-land-scene-with-road-childish_76964-146781.jpg?w=2000" },
            { name: "再来一次", img: "https://img.magnific.com/premium-vector/try-again-text-symbol-stamp-red-rubber-stamp-sticker-icon-symbolize-trying-again-persistence-icon_896322-205.jpg?w=2000" }
        ];
        let prizeList = [];
        let historyList = [];

        const prizeGrid = document.getElementById('prizeGrid');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const resultCard = document.getElementById('resultCard');
        const historyGrid = document.getElementById('historyGrid');
        let prizeCards = [];

        // 数组打乱
        function shuffle(arr){
            const newArr = [...arr];
            for(let i=newArr.length-1;i>0;i--){
                const j = Math.floor(Math.random()*(i+1));
                [newArr[i],newArr[j]] = [newArr[j],newArr[i]];
            }
            return newArr;
        }
        //渲染问号卡片
        function renderPrize(){
            prizeGrid.innerHTML = '';
            prizeCards = [];
            prizeList.forEach(()=>{
                const card = document.createElement('div');
                card.className = "prize-card";
                card.innerText = "?";
                prizeGrid.appendChild(card);
                prizeCards.push(card);
            })
        }
        //渲染历史
        function renderHistory(){
            historyGrid.innerHTML = '';
            historyList.forEach(item=>{
                const div = document.createElement('div');
                div.className = "history-item";
                if(item.img){
                    div.innerHTML = `<img src="${item.img}" alt="${item.name}"><div class="name">${item.name}</div>`;
                }else{
                    div.innerHTML = `<div class="noimg">无图</div><div class="name">${item.name}</div>`;
                }
                historyGrid.appendChild(div);
            })
        }
        //初始化
        function init(){
            prizeList = shuffle(basePrizeList);
            renderPrize();
            resultCard.innerHTML = `<div class="question">?</div>`;
        }
        init();
        renderHistory();

        startBtn.onclick = async ()=>{
            startBtn.disabled = true;
            resetBtn.disabled = true;
            resultCard.innerHTML = `<div class="question">?</div>`;
            prizeCards.forEach(card=>card.classList.remove('flash'));

            //闪动动画
            for(let i=0;i<28;i++){
                const rand = Math.floor(Math.random()*prizeList.length);
                prizeCards.forEach(card=>card.classList.remove('flash'));
                prizeCards[rand].classList.add('flash');
                await sleep(75);
            }
            const winIdx = Math.floor(Math.random()*prizeList.length);
            prizeCards.forEach(card=>card.classList.remove('flash'));
            prizeCards[winIdx].classList.add('flash');
            const winPrize = prizeList[winIdx];

            //加入历史
            historyList.push(winPrize);
            renderHistory();

            if(winPrize.img){
                resultCard.innerHTML = `
                    <img src="${winPrize.img}" alt="${winPrize.name}">
                    <div class="result-name">🎉 ${winPrize.name}</div>
                `
            }else{
                resultCard.innerHTML = `
                    <div class="noimg">无图</div>
                    <div class="result-name">🎉 ${winPrize.name}</div>
                `
            }
            //抽完打乱顺序
            prizeList = shuffle(prizeList);
            renderPrize();
            startBtn.disabled = false;
            resetBtn.disabled = false;
        }

        resetBtn.onclick = ()=>{
            init();
        }
        clearHistoryBtn.onclick = ()=>{
            historyList = [];
            renderHistory();
        }
        function sleep(ms){
            return new Promise(resolve=>setTimeout(resolve,ms));
        }
    </script>
</body>
</html>
